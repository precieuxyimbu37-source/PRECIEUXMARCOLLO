<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PRECIEUXMARCOLLO — Liens officiels</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      background:
        radial-gradient(circle at top, #3a2b00 0%, #111 35%, #050505 75%);
      display: flex;
      justify-content: center;
      padding: 45px 20px;
    }

    .container {
      width: 100%;
      max-width: 560px;
      text-align: center;
    }

    .logo {
      width: 105px;
      height: 105px;
      margin: 0 auto 22px;
      border-radius: 50%;
      background: linear-gradient(145deg, #ffd700, #9c7400);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #090909;
      font-size: 24px;
      font-weight: 900;
      box-shadow: 0 0 35px rgba(255, 215, 0, 0.25);
    }

    h1 {
      font-size: 31px;
      letter-spacing: 3px;
      margin-bottom: 10px;
    }

    .gold {
      color: #ffd700;
    }

    .description {
      color: #bdbdbd;
      font-size: 15px;
      margin-bottom: 32px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .link {
      text-decoration: none;
      color: white;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 215, 0, 0.35);
      padding: 19px 22px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      transition: 0.25s ease;
      backdrop-filter: blur(10px);
    }

    .link:hover {
      transform: translateY(-3px);
      background: linear-gradient(90deg, #ffd700, #b8860b);
      color: #050505;
      border-color: #ffd700;
      box-shadow: 0 8px 30px rgba(255, 215, 0, 0.2);
    }

    .icon {
      margin-right: 10px;
      font-size: 19px;
    }

    footer {
      margin-top: 38px;
      color: #777;
      font-size: 12px;
      letter-spacing: 1px;
    }

    @media (max-width: 500px) {
      body {
        padding-top: 30px;
      }

      h1 {
        font-size: 25px;
      }

      .link {
        padding: 17px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="logo">
      PM
    </div>

    <h1>PRECIEUX<span class="gold">MARCOLLO</span></h1>

    <p class="description">
      Bienvenue sur notre espace officiel. Retrouvez tous nos liens ici.
    </p>

    <div class="links">

      <a class="link" href="https://www.youtube.com/@Marcollo20" target="_blank">
        <span class="icon">▶</span>
        YouTube — Marcollo20
      </a>

      <a class="link" href="https://www.youtube.com/@RHMYTB" target="_blank">
        <span class="icon">▶</span>
        YouTube — RHMYTB
      </a>

      <a class="link" href="https://discord.gg/jP5nKJ7Rd" target="_blank">
        <span class="icon">💬</span>
        Discord — Communauté
      </a>

      <a class="link" href="https://discord.gg/WF46uAPn" target="_blank">
        <span class="icon">💬</span>
        Discord — Serveur
      </a>

    </div>

    <footer>
      © 2026 PRECIEUXMARCOLLO — Tous droits réservés
    </footer>

  </main>

</body>
</html>
